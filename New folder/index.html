<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Personal Expense Tracker</h1>
            <p>Track your spending easily</p>
        </header>

        <section class="summary">

            <div class="card">
                <h3>Total Spent</h3>
                <p id="totalAmount">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenseCount">0</p>
            </div>

            <div class="card">
                <h3>Remaining Budget</h3>
                <p id="remainingBudget">₹0</p>
            </div>

        </section>

        <section class="form-section">
            <h2>💰 Set Monthly Budget</h2>

            <div class="budget-form">
                <input type="number" id="budgetInput" placeholder="Enter monthly budget (₹)" min="1">

                <button type="button" onclick="setBudget()">
                    Set Budget
                </button>
            </div>

            <p id="budgetMessage"></p>
        </section>

        <section class="form-section">
            <h2>Add Expense</h2>

            <form id="expenseForm">

                <input type="number" id="amount" placeholder="Amount (₹)" required min="1">

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <input type="date" id="date" required>

                <input type="text" id="description" placeholder="Description" required>

                <button type="submit">+ Add Expense</button>

            </form>
        </section>

        <section class="filter-section">

            <input type="text" id="search" placeholder="🔍 Search expenses...">

            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

        </section>

        <section>
            <h2>Recent Transactions</h2>

            <div id="expenseList"></div>
        </section>

        <section class="category-summary">
            <h2>Category Summary</h2>
            <div id="categorySummary"></div>
        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
